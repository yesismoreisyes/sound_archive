<title>사운드 워크 — On My Ways | 2026</title>
<style>
:root {color-scheme:dark; --paper:#eceae5; --muted:#85898e; --accent:#edaa64; --bg:#030405; }
*{box-sizing:border-box} html{background:var(--bg)} body{margin:0; min-height:100svh;background:var(--bg);color:var(--paper);font-family:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit} .shell{width:100%;max-width:580px;margin:0 auto;min-height:100svh;position:relative;overflow:hidden;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.top{position:relative;z-index:3;padding:calc(30px + env(safe-area-inset-top)) 24px 0}.kicker{font-size:10px;letter-spacing:.28em;color:#858a8e;margin:0 0 13px}.top h1{font-size:clamp(22px,6vw,33px);font-weight:450;letter-spacing:-.055em;line-height:1.23;margin:0;word-break:keep-all}

/* ── 스테이지: 지도가 또렷이 보이고, 그 위를 작은 유리 구슬이 떠다님 ── */
.stage{width:100%;aspect-ratio:963/1498;position:relative;isolation:isolate;overflow:hidden;touch-action:pan-y;margin-top:22px}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(3,4,5,.35) 0%,rgba(3,4,5,0) 6%,rgba(3,4,5,0) 93%,rgba(3,4,5,.8) 100%);z-index:3}
.stage-underlay{position:absolute;inset:0;background:#07090a;z-index:0}
.stage-map{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.9;filter:brightness(.95) contrast(1.04) saturate(.95);z-index:1}
.stage-map-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:#6f767b;letter-spacing:.08em;z-index:1;background:radial-gradient(ellipse at center,#121517,#050607 75%)}
.ambient{position:absolute;left:0;top:0;width:170px;height:170px;border-radius:50%;filter:blur(34px);opacity:.42;pointer-events:none;mix-blend-mode:screen;transform:translate(-50%,-50%);z-index:2}
.ambient.blue{background:radial-gradient(circle,rgba(90,185,255,1),rgba(20,110,255,.5) 40%,rgba(20,110,255,0) 72%)}
.ambient.orange{background:radial-gradient(circle,rgba(255,180,100,1),rgba(255,110,30,.5) 40%,rgba(255,110,30,0) 72%)}

/* 유리 구슬 */
.orb{--t:70,170,255;--c:190,235,255;position:absolute;left:0;top:0;width:clamp(56px,15vw,78px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:4}
.orb.orange{--t:255,135,40;--c:255,225,170}
.orb > span{position:absolute;border-radius:50%}
/* 바닥 그림자 + 유리가 모은 빛(코스틱) */
.orb .shadow{left:22%;top:70%;width:92%;height:42%;z-index:-1;filter:blur(5px);
 background:radial-gradient(ellipse at 42% 42%,rgba(var(--c),.75) 0%,rgba(var(--t),.45) 20%,rgba(var(--t),.12) 42%,rgba(0,0,0,.25) 55%,rgba(0,0,0,0) 74%)}
/* 렌즈: 아래 지도를 확대·반전해서 보여 줌 (진짜 유리구슬처럼) */
.orb .lens{inset:0;overflow:hidden;background-repeat:no-repeat;background-color:rgba(10,12,14,.15);transform:rotate(180deg);filter:brightness(1.05) contrast(1.06) saturate(1.05)}
/* 색유리 본체: 전체가 투명한 색으로 물들고, 안쪽에서 빛이 나옴 */
.orb .glass{inset:0;
 background:
  radial-gradient(circle at 46% 46%,rgba(var(--c),.38) 0%,rgba(var(--t),.22) 30%,rgba(var(--t),.20) 55%,rgba(var(--t),.48) 80%,rgba(var(--c),.75) 96%,rgba(var(--c),.3) 100%);
 box-shadow:inset 0 0 0 .7px rgba(var(--c),.7),inset 0 0 16px rgba(var(--t),.55),inset -6px -8px 12px rgba(0,0,0,.22),
  0 0 10px rgba(var(--t),.75),0 0 28px rgba(var(--t),.45),0 0 60px rgba(var(--t),.22);
 animation:glow 5.5s ease-in-out infinite}
.orb.orange .glass{animation-delay:-2.7s}
@keyframes glow{50%{box-shadow:inset 0 0 0 .7px rgba(var(--c),.8),inset 0 0 20px rgba(var(--t),.7),inset -6px -8px 12px rgba(0,0,0,.22),
  0 0 14px rgba(var(--t),.9),0 0 36px rgba(var(--t),.55),0 0 76px rgba(var(--t),.3)}}
@media (prefers-reduced-motion:reduce){.orb .glass{animation:none}}
/* 하이라이트 */
.orb .hl{left:17%;top:11%;width:38%;height:19%;transform:rotate(-38deg);filter:blur(.8px);
 background:radial-gradient(ellipse at center,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 35%,rgba(255,255,255,0) 72%)}
.orb .hl2{right:13%;bottom:11%;width:40%;height:15%;transform:rotate(-38deg);filter:blur(2px);
 background:radial-gradient(ellipse at center,rgba(var(--c),.9) 0%,rgba(var(--t),.4) 40%,rgba(255,255,255,0) 72%)}
.orb .dot{right:24%;top:20%;width:7%;height:7%;background:rgba(255,255,255,.8);filter:blur(.6px)}

.player{position:relative;z-index:3;padding:0 24px}.line{height:1px;background:#25282b;margin:0 0 14px}.track-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--accent);margin-bottom:7px}.playing-name{font-size:13px;font-weight:500;letter-spacing:.02em;color:#c9cbcc;margin:0 0 4px}.counter{font-size:11px;letter-spacing:.16em;color:#868b90;white-space:nowrap;padding-top:3px}.progress{margin:22px 0 7px;width:100%;appearance:none;background:transparent;height:15px;cursor:pointer;display:block}.progress::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--progress,0%),#2a2e30 var(--progress,0%),#2a2e30 100%);height:2px}.progress::-moz-range-track{background:#2a2e30;height:2px}.progress::-moz-range-progress{background:var(--accent);height:2px}.progress::-webkit-slider-thumb{appearance:none;width:12px;height:12px;background:#eee6dc;border-radius:50%;margin-top:-5px}.progress::-moz-range-thumb{width:12px;height:12px;background:#eee6dc;border:0;border-radius:50%}.times{display:flex;justify-content:space-between;color:#7b8085;font-size:11px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;justify-content:center;gap:19px;margin-top:18px}.controls button{width:58px;height:55px;border:1px solid #24272a;border-radius:15px;background:#121416;cursor:pointer;display:grid;place-items:center;transition:background .15s}.controls button:active{background:#272c30}.controls .play{width:72px;height:62px;border-color:#8e633e;background:#352318;color:#ffe6ca}.controls svg{height:20px;width:20px;fill:currentColor}.notice{min-height:16px;margin:13px 0 0;font-size:11px;line-height:1.5;color:#8b8e90;text-align:center}
.archive{padding:36px 24px 0}.archive-head{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #25282b;padding-top:23px;margin-bottom:17px}.archive h2{margin:0;font-family:"Noto Serif KR",serif;font-weight:400;font-size:25px}.count{font-size:10px;color:#888;letter-spacing:.2em}.reels{list-style:none;padding:0;margin:0}.reel{display:grid;grid-template-columns:34px 1fr 28px;gap:10px;align-items:center;padding:17px 0;border-bottom:1px solid #1e2022;cursor:pointer;width:100%;background:transparent;border-top:0;border-left:0;border-right:0;text-align:left}.reel .num{font-size:12px;letter-spacing:.06em;color:#6d7479}.reel .name{font-size:17px;letter-spacing:-.02em}.reel .role{margin-top:6px;font-size:11px;color:#85898c}.reel .mark{font-size:20px;color:#777;text-align:right;font-weight:200}.reel.selected .num,.reel.selected .name,.reel.selected .mark{color:var(--accent)}.footer{font-size:10px;line-height:1.6;color:#6e757a;padding:29px 24px 0;letter-spacing:.08em}
@media (min-width:700px){body{display:grid;place-items:start center}.shell{box-shadow:0 0 80px #090e13}}


/* ── 첫 화면: 제목·지도·플레이어가 한 화면 안에 ── */
.hero{height:100svh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.hero .top{flex:none;padding:calc(14px + env(safe-area-inset-top)) 20px 0}

.hero .stage{flex:1 1 auto;min-height:0;height:auto;aspect-ratio:auto;margin-top:10px}

.track-meta{align-items:baseline}
.playing-name{margin:0}
.playing-place{font-size:12px;color:#8b8f92;margin-left:8px;font-weight:400;letter-spacing:0}
.hero .progress{margin:8px 0 4px}

.footer p{margin:0}.footer .credit-title{color:#c9cbcc;font-size:12px;letter-spacing:0;margin-bottom:6px}.footer .credit-name{margin-top:14px;color:#c9cbcc;font-size:12px;letter-spacing:.04em}
.playing-place,.reel .role,.footer,.notice,.times{font-weight:500}
.sub{position:absolute;left:0;top:0;z-index:5;margin:0;max-width:min(80%,330px);width:max-content;text-align:center;font-size:15px;line-height:1.5;font-weight:500;letter-spacing:-.01em;color:#f3efe8;background:rgba(3,4,5,.62);padding:5px 11px 6px;border-radius:7px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);word-break:keep-all;overflow-wrap:break-word;pointer-events:none;opacity:0;transition:opacity .35s ease;will-change:transform}
.sub.on{opacity:1}
@media (prefers-reduced-motion:reduce){.sub{transition:none}}
[hidden]{display:none!important}
.top h1{font-size:clamp(23px,5.6vw,31px);letter-spacing:-.045em;line-height:1.35;overflow-wrap:normal;word-break:keep-all}
.top .year{margin:10px 0 0;font-size:12px;letter-spacing:.28em;color:#a0a4a6}
.map-section{padding:34px 24px 0;position:relative;z-index:3}
.map-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.map-head h2{font-size:12px;letter-spacing:.15em;color:#d8d8d4;margin:0;font-weight:450}
.map-id{font-size:10px;letter-spacing:.18em;color:#858b90}
.map-open{position:relative;width:100%;border:1px solid #25282b;border-radius:13px;display:block;overflow:hidden;background:#0c0d0e;padding:0;cursor:zoom-in;text-align:left;aspect-ratio:963/1498}
.map-open img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .38s ease,transform .5s ease;filter:brightness(.84)}
.map-open:active img{transform:scale(1.025)}
.map-open:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 63%,rgba(0,0,0,.75))}
.map-placeholder{display:grid;place-items:center;position:absolute;inset:0;text-align:center;line-height:1.8;color:#83888a;letter-spacing:.08em;font-size:12px;padding:18px;background:radial-gradient(ellipse at center,#15191b,#08090a 70%)}
.map-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:#8b8f92;font-size:10px;letter-spacing:.04em}
.map-foot .zoom{color:#aaa9a5}
.map-dialog{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.97);border:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;padding:calc(64px + env(safe-area-inset-top)) 14px calc(35px + env(safe-area-inset-bottom));overflow:auto;color:#eae8e4}
.map-dialog::backdrop{background:rgba(0,0,0,.97)}
.map-dialog img{width:100%;height:auto;object-fit:contain;display:block;max-width:750px;margin:0 auto}
.map-dialog .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:16px;background:#1b1f21;border:1px solid #474a4d;border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:23px}
.map-dialog .dialog-title{position:fixed;top:calc(19px + env(safe-area-inset-top));left:18px;font-size:11px;letter-spacing:.14em;color:#c1c5c5}
@media (prefers-reduced-motion: reduce){.map-open img{transition:none}}

/* ── 밝은 테마 (옅은 회색) — 지도 이미지는 흑백 배경 + 색 동선으로 미리 만들어 둠 ── */
:root{--bg:#e7e7e5;--paper:#202224;--accent:#3d6fa8;color-scheme:light}
html,body,.shell{background:#e7e7e5!important;color:#202224}
.shell{box-shadow:none!important}
.stage-underlay{background:#e7e7e5!important}
.stage:after{background:none!important}
.stage-map{filter:none!important;opacity:.92!important;mix-blend-mode:multiply}
.orb .lens{filter:brightness(1.05)!important}
.ambient{mix-blend-mode:multiply!important;opacity:.28!important}
/* 구슬 색이 천천히 바뀜 (약 90초에 한 바퀴, 두 구슬은 늘 반대 색) */
.orb,.ambient{animation:hue 90s linear infinite}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb,.ambient{animation:none}}
.top h1,.playing-name,.reel .name,.archive h2,.footer .credit-title,.footer .credit-name{color:#202224!important}
.top .year,.playing-place,.times,.reel .role,.footer,.count,.notice{color:#6b6f73!important}
.reel .num,.reel .mark{color:#979b9f!important}
.line,.archive-head{background:#cfd0d0!important;border-color:#cfd0d0!important}
.reel{border-color:#cfd0d0!important}
.progress::-webkit-slider-runnable-track{background:linear-gradient(to right,#3d6fa8 0%,#3d6fa8 var(--progress,0%),#cfd0d0 var(--progress,0%),#cfd0d0 100%)!important}
.progress::-webkit-slider-thumb{background:#202224!important}
.controls button{background:#dcdddc!important;border-color:#c6c8c8!important;color:#202224!important}
.controls .play{background:#202224!important;border-color:#202224!important;color:#e7e7e5!important}
.reel.selected .num,.reel.selected .name,.reel.selected .mark{color:#3d6fa8!important}
.sub{background:rgba(32,34,36,.78)!important;color:#f2f2f0!important;box-shadow:0 1px 10px rgba(0,0,0,.08)}
</style>

<body>
<main class="shell">
<div class="hero">
<header class="top"><h1>사운드 워크 — On My Ways</h1><p class="kicker year">2026</p></header>

  <div class="stage-underlay"></div>

 <div class="line"></div><div class="track-meta"><h2 class="playing-name"><span id="playing-name">트랙 01</span><span class="playing-place" id="playing-place">factory2</span></h2></div>
 <input class="progress" id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" />

  <button type="button" id="prev" aria-label="이전 트랙"><svg viewBox="0 0 24 24"><path d="M5 4h2v16H5zm14 0v16L8 12z"/></svg></button>

 </div><p class="notice" id="notice" role="status"></p>

<script>
// 여기서 트랙의 제목과 설명을 변경하세요. audio 폴더의 파일 이름과 일치해야 합니다.
const tracks = [
 {title:'트랙 01',role:'factory2',src:'audio/01.mp3',map:'maps/01.jpg'},
 {title:'트랙 02',role:'계단',src:'audio/02.mp3',map:'maps/02.jpg'},
 {title:'트랙 03',role:'8층',src:'audio/03.mp3',map:'maps/03.jpg'},
 {title:'트랙 04',role:'새문안로',src:'audio/04.mp3',map:'maps/04.jpg'},
 {title:'트랙 05',role:'계단',src:'audio/05.mp3',map:'maps/05.jpg'},
 {title:'트랙 06',role:'옛러시아 공사관 앞',src:'audio/06.mp3',map:'maps/06.jpg'},
 {title:'트랙 07',role:'공원에서 정동길로 가는 길',src:'audio/07.mp3',map:'maps/07.jpg'},
 {title:'트랙 08',role:'정동길',src:'audio/08.mp3',map:'maps/08.jpg'}
];
const $=id=>document.getElementById(id);
const audio=$('audio'), reels=$('reels'), seek=$('seek'); let index=0;
function fmt(s){if(!Number.isFinite(s))return '00:00'; const m=Math.floor(s/60),r=Math.floor(s%60);return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`}
function syncPlay(){const isPlaying=!audio.paused;$('play-icon').innerHTML=isPlaying?'<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('play').setAttribute('aria-label',isPlaying?'일시정지':'재생')}
function render(){reels.innerHTML='';tracks.forEach((track,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='reel'+(i===index?' selected':'');btn.setAttribute('aria-label',`${i+1}번 ${track.title} 재생`);btn.setAttribute('aria-current',i===index?'true':'false');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const info=document.createElement('span');const name=document.createElement('div');name.className='name';name.textContent=track.title;const role=document.createElement('div');role.className='role';role.textContent=track.role;info.append(name,role);const mark=document.createElement('span');mark.className='mark';mark.textContent=i===index?'−':'+';btn.append(num,info,mark);btn.addEventListener('click',()=>load(i,true));reels.append(btn)})}

// 각 트랙에서 maps/01.jpg ... maps/10.jpg 경로를 읽습니다.
const mapImg=$('map-image'), mapLarge=$('map-large'), mapPlaceholder=$('map-placeholder'), mapDialog=$('map-dialog');
const stageMap=$('stage-map'), stageMapPlaceholder=$('stage-map-placeholder');
let mapAvailable=false;
function updateMap(){

const subEl=$('sub'); let subIdx=-2;
function currentSub(){
 const list=SUBS[index]||[], t=audio.currentTime;
 if(audio.paused&&t===0)return -1;
 for(let k=list.length-1;k>=0;k--){
  const [s,e]=list[k]; if(t<s)continue;
  const nextS=k+1<list.length?list[k+1][0]:Infinity;
  return t<Math.min(Math.max(e+1.2,s+1.6),nextS)?k:-1;
 }
 return -1;
}
function placeSub(W,H,sec,ox,oy,dw,dh){
 const k=currentSub();
 if(k!==subIdx){subIdx=k; if(k>=0){subEl.textContent=SUBS[index][k][2];subEl.classList.add('on')}else subEl.classList.remove('on')}
 if(k<0)return;
 // 구슬과 다른 주기의 느린 궤적 (읽기 쉽도록 작게, 지도 아래쪽 중심)
 const cx=ox+dw*(.5+.17*Math.sin(sec*.047+1.3)+.05*Math.sin(sec*.019+4.1));
 const cy=oy+dh*(.68+.07*Math.sin(sec*.061+.4)+.04*Math.cos(sec*.027+2.2));
 const sw=subEl.offsetWidth, sh=subEl.offsetHeight, pad=10;
 const x=Math.min(Math.max(cx-sw/2,pad),W-sw-pad);
 const y=Math.min(Math.max(cy-sh/2,pad),H-sh-pad);
 subEl.style.transform=`translate(${x}px,${y}px)`;
}
function move(t){
 const seconds=t/1000,w=stage.clientWidth,h=stage.clientHeight;
 let dw=w,dh=h,ox=0,oy=0;
 if(mapInfo&&mapInfo.nw){const s=Math.min(w/mapInfo.nw,h/mapInfo.nh);dw=mapInfo.nw*s;dh=mapInfo.nh*s;ox=(w-dw)/2;oy=(h-dh)/2}
 ob.forEach((o,i)=>{
  const p=o.phase;
  const x=ox+dw*(i===0?.32:.68)+Math.sin(seconds*.11+p)*dw*.14+Math.sin(seconds*.07+p*2.1)*dw*.05;
  const y=oy+dh*(i===0?.42:.56)+Math.cos(seconds*.13+p)*dh*.16+Math.sin(seconds*.085+p)*dh*.06;
  o.orb.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;
  o.glow.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;
  if(mapInfo&&mapInfo.nw){
   const d=o.orb.offsetWidth;
   o.lens.style.backgroundSize=`${dw*MAG}px ${dh*MAG}px`;
   o.lens.style.backgroundPosition=`${d/2-(x-ox)*MAG}px ${d/2-(y-oy)*MAG}px`;
  }
 });

}
load(0);

if(reduced)audio.addEventListener('timeupdate',()=>{const w=stage.clientWidth,h=stage.clientHeight;placeSub(w,h,0,0,0,w,h)});
