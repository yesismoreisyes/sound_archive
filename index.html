<style>
:root {color-scheme:dark; --paper:#eceae5; --muted:#85898e; --accent:#edaa64; --bg:#030405; }
*{box-sizing:border-box} html{background:var(--bg)} body{margin:0; min-height:100svh;background:var(--bg);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit} .shell{width:100%;max-width:580px;margin:0 auto;min-height:100svh;position:relative;overflow:hidden;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.top{position:relative;z-index:3;padding:calc(30px + env(safe-area-inset-top)) 24px 0}.kicker{font-size:10px;letter-spacing:.28em;color:#858a8e;margin:0 0 13px}.top h1{font-size:clamp(22px,6vw,33px);font-weight:450;letter-spacing:-.055em;line-height:1.23;margin:0;word-break:keep-all}.top .sub{margin:10px 0 0;font-size:12px;line-height:1.6;color:#94999d}
.stage{height:clamp(300px,47svh,480px);max-height:490px;position:relative;isolation:isolate;overflow:hidden;touch-action:pan-y}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#030405 0%,transparent 16%,transparent 65%,#030405 100%);z-index:2}.ambient{position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(74px);opacity:.26;pointer-events:none;mix-blend-mode:screen;transform:translate(-50%,-50%);will-change:left,top}.ambient.blue{background:radial-gradient(circle,#4fc2ff 0%,#1a7cff 42%,rgba(18,107,243,0) 72%)}.ambient.orange{background:radial-gradient(circle,#ffcf8d 0%,#ff7d28 42%,rgba(237,105,35,0) 72%)}
.orb{position:absolute;width:clamp(126px,37vw,198px);aspect-ratio:1;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform,left,top;pointer-events:none;isolation:isolate;overflow:visible}
.orb::before{content:"";position:absolute;inset:-18%;border-radius:50%;filter:blur(26px);opacity:.42;z-index:-2}
.orb::after{content:"";position:absolute;left:15%;top:10%;width:43%;height:18%;border-radius:50%;transform:rotate(-30deg);background:rgba(255,255,255,.72);filter:blur(10px);opacity:.88;z-index:4}
.orb .core,.orb .ring,.orb .caustic,.orb .spark{position:absolute;inset:0;border-radius:50%}
.orb .ring{inset:.5%;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.orb .spark{inset:12% 16% auto auto;width:18%;height:18%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.02) 72%);filter:blur(2px);opacity:.85}
.orb .caustic{inset:auto 16% 17% 18%;height:24%;background:radial-gradient(ellipse at center,rgba(255,255,255,.34),rgba(255,255,255,0) 68%);filter:blur(8px);opacity:.65;mix-blend-mode:screen}
.orb.blue .core{background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.92) 0%,rgba(223,246,255,.92) 10%,rgba(184,232,255,.5) 18%,rgba(104,195,255,.16) 28%,rgba(51,145,255,.08) 42%,rgba(25,91,177,.22) 60%,rgba(4,28,67,.55) 76%,rgba(1,6,12,.2) 100%),radial-gradient(circle at 68% 72%,rgba(190,232,255,.34) 0%,rgba(78,164,255,.16) 24%,rgba(8,47,107,.42) 58%,rgba(0,0,0,.55) 88%),linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,0) 45%);box-shadow:inset 11px 12px 18px rgba(255,255,255,.24),inset -18px -18px 28px rgba(2,17,42,.62),inset 0 0 36px rgba(136,223,255,.18),0 0 15px rgba(97,182,255,.34),0 0 42px rgba(30,108,255,.23);backdrop-filter:blur(1px) saturate(130%)}
.orb.blue .ring{border-color:rgba(182,226,255,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), inset 5px 5px 10px rgba(255,255,255,.06), inset -8px -8px 14px rgba(5,21,54,.4)}
.orb.blue::before{background:#1a8cff}
.orb.orange .core{background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.93) 0%,rgba(255,247,224,.9) 9%,rgba(255,225,170,.48) 18%,rgba(255,166,83,.18) 28%,rgba(255,121,33,.1) 42%,rgba(181,71,14,.24) 60%,rgba(75,25,7,.58) 78%,rgba(12,7,4,.24) 100%),radial-gradient(circle at 68% 72%,rgba(255,231,185,.30) 0%,rgba(255,164,76,.18) 24%,rgba(126,49,10,.42) 58%,rgba(0,0,0,.55) 88%),linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,0) 45%);box-shadow:inset 10px 12px 18px rgba(255,255,255,.22),inset -18px -18px 28px rgba(67,20,2,.55),inset 0 0 34px rgba(255,222,142,.14),0 0 16px rgba(255,166,95,.28),0 0 42px rgba(255,110,37,.23);backdrop-filter:blur(1px) saturate(130%)}
.orb.orange .ring{border-color:rgba(255,217,169,.42);box-shadow:inset 0 0 0 1px rgba(255,255,255,.11), inset 5px 5px 10px rgba(255,255,255,.05), inset -8px -8px 14px rgba(72,24,5,.34)}
.orb.orange::before{background:#ff8b35}
.stage-note{position:absolute;bottom:17px;width:100%;text-align:center;font-size:9px;letter-spacing:.22em;color:#70787e;z-index:3}.player{position:relative;z-index:3;padding:0 24px}.line{height:1px;background:#25282b;margin:0 0 20px}.track-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--accent);margin-bottom:7px}.playing-name{font-size:19px;font-weight:520;letter-spacing:-.035em;margin:0 0 5px}.playing-role{font-size:11px;color:#858b8e;min-height:16px}.counter{font-size:11px;letter-spacing:.16em;color:#868b90;white-space:nowrap;padding-top:3px}.progress{margin:22px 0 7px;width:100%;appearance:none;background:transparent;height:15px;cursor:pointer;display:block}.progress::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--progress,0%),#2a2e30 var(--progress,0%),#2a2e30 100%);height:2px}.progress::-moz-range-track{background:#2a2e30;height:2px}.progress::-moz-range-progress{background:var(--accent);height:2px}.progress::-webkit-slider-thumb{appearance:none;width:12px;height:12px;background:#eee6dc;border-radius:50%;margin-top:-5px}.progress::-moz-range-thumb{width:12px;height:12px;background:#eee6dc;border:0;border-radius:50%}.times{display:flex;justify-content:space-between;color:#7b8085;font-size:11px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;justify-content:center;gap:19px;margin-top:18px}.controls button{width:58px;height:55px;border:1px solid #24272a;border-radius:15px;background:#121416;cursor:pointer;display:grid;place-items:center;transition:background .15s}.controls button:active{background:#272c30}.controls .play{width:72px;height:62px;border-color:#8e633e;background:#352318;color:#ffe6ca}.controls svg{height:20px;width:20px;fill:currentColor}.notice{min-height:16px;margin:13px 0 0;font-size:11px;line-height:1.5;color:#8b8e90;text-align:center}
.archive{padding:36px 24px 0}.archive-head{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #25282b;padding-top:23px;margin-bottom:17px}.archive h2{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-weight:400;font-size:25px}.count{font-size:10px;color:#888;letter-spacing:.2em}.reels{list-style:none;padding:0;margin:0}.reel{display:grid;grid-template-columns:34px 1fr 28px;gap:10px;align-items:center;padding:17px 0;border-bottom:1px solid #1e2022;cursor:pointer;width:100%;background:transparent;border-top:0;border-left:0;border-right:0;text-align:left}.reel .num{font-size:12px;letter-spacing:.06em;color:#6d7479}.reel .name{font-size:17px;letter-spacing:-.02em}.reel .role{margin-top:6px;font-size:11px;color:#85898c}.reel .mark{font-size:20px;color:#777;text-align:right;font-weight:200}.reel.selected .num,.reel.selected .name,.reel.selected .mark{color:var(--accent)}.footer{font-size:10px;line-height:1.6;color:#6e757a;padding:29px 24px 0;letter-spacing:.08em}
@media (min-width:700px){body{display:grid;place-items:start center}.shell{box-shadow:0 0 80px #090e13}.stage{height:390px}}
@media (prefers-reduced-motion:reduce){.orb,.ambient{will-change:auto}}

[hidden]{display:none!important}
/* 제목: 작은 화면에서도 조용한 두 줄 구성 */
.top h1{font-size:clamp(23px,5.6vw,31px);letter-spacing:-.045em;line-height:1.35;overflow-wrap:normal;word-break:keep-all}
.top .year{margin:10px 0 0;font-size:12px;letter-spacing:.28em;color:#a0a4a6}
/* 각 트랙의 공간을 보여 주는 지도 */
.map-section{padding:34px 24px 0;position:relative;z-index:3}
.map-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.map-head h2{font-size:12px;letter-spacing:.15em;color:#d8d8d4;margin:0;font-weight:450}
.map-id{font-size:10px;letter-spacing:.18em;color:#858b90}
.map-open{position:relative;width:100%;border:1px solid #25282b;border-radius:13px;display:block;overflow:hidden;background:#0c0d0e;padding:0;cursor:zoom-in;text-align:left;aspect-ratio:1.52}
.map-open img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .38s ease,transform .5s ease;filter:brightness(.84)}
.map-open:active img{transform:scale(1.025)}
.map-open:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 63%,rgba(0,0,0,.75))}
.map-placeholder{display:grid;place-items:center;position:absolute;inset:0;text-align:center;line-height:1.8;color:#83888a;letter-spacing:.08em;font-size:12px;padding:18px;background:radial-gradient(ellipse at center,#15191b,#08090a 70%)}
.map-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:#8b8f92;font-size:10px;letter-spacing:.04em}
.map-foot .zoom{color:#aaa9a5}
.map-dialog{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.97);border:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;padding:calc(64px + env(safe-area-inset-top)) 14px calc(35px + env(safe-area-inset-bottom));overflow:auto;color:#eae8e4}
.map-dialog::backdrop{background:rgba(0,0,0,.97)}
.map-dialog img{width:100%;height:auto;object-fit:contain;display:block;max-width:750px;margin:0 auto}
.map-dialog .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:16px;background:#1b1f21;border:1px solid #474a4d;border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:23px}
.map-dialog .dialog-title{position:fixed;top:calc(19px + env(safe-area-inset-top));left:18px;font-size:11px;letter-spacing:.14em;color:#c1c5c5}
@media (prefers-reduced-motion: reduce){.map-open img{transition:none}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><h1>사운드 워크 — On My Ways</h1><p class="kicker year">2026</p></header>
<section class="stage" aria-label="빛나는 파란색과 주황색의 유리 구슬 두 개가 부유하는 장면">
  <div class="ambient blue" id="glow-blue"></div><div class="ambient orange" id="glow-orange"></div>
  <div class="orb blue" id="orb-blue"><span class="core"></span><span class="ring"></span><span class="caustic"></span><span class="spark"></span></div><div class="orb orange" id="orb-orange"><span class="core"></span><span class="ring"></span><span class="caustic"></span><span class="spark"></span></div>
  <div class="stage-note">TWO LIGHTS / TEN VOICES</div>
</section>
<section class="player" aria-label="오디오 플레이어">
 <div class="line"></div><div class="track-meta"><div><div class="eyebrow">NOW PLAYING</div><h2 class="playing-name" id="playing-name">트랙 01</h2><div class="playing-role" id="playing-role">인터뷰</div></div><span class="counter" id="counter">01 / 10</span></div>
 <input class="progress" id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" />
 <div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
 <div class="controls">
  <button type="button" id="prev" aria-label="이전 트랙"><svg viewBox="0 0 24 24"><path d="M5 4h2v16H5zm14 0v16L8 12z"/></svg></button>
  <button type="button" class="play" id="play" aria-label="재생"><svg id="play-icon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
  <button type="button" id="next" aria-label="다음 트랙"><svg viewBox="0 0 24 24"><path d="M17 4h2v16h-2zM5 4v16l11-8z"/></svg></button>
 </div><p class="notice" id="notice" role="status">음원 파일을 올리면 재생할 수 있습니다.</p>
</section>
<section class="map-section" aria-label="현재 트랙 이동 경로 지도">
 <div class="map-head"><h2>WALK MAP</h2><span class="map-id" id="map-id">01 / 10</span></div>
 <button class="map-open" type="button" id="map-open" aria-label="현재 트랙 지도 확대해서 보기">
  <img id="map-image" src="maps/01.png" alt="트랙 01의 이동 경로 지도" />
  <div class="map-placeholder" id="map-placeholder" hidden>이 트랙의 지도는 준비 중입니다.</div>
 </button>
 <div class="map-foot"><span id="map-caption">TRACK 01 · WALK ROUTE</span><span class="zoom">TAP TO EXPAND ↗</span></div>
</section>
<dialog class="map-dialog" id="map-dialog" aria-label="이동 경로 확대 지도">
 <span class="dialog-title" id="dialog-title">TRACK 01 · WALK MAP</span>
 <button class="close" type="button" id="map-close" aria-label="지도 닫기">×</button>
 <img id="map-large" src="maps/01.png" alt="선택한 트랙의 전체 이동 경로 지도" />
</dialog>
<section class="archive" aria-label="릴 목록"><div class="archive-head"><h2>릴 목록</h2><span class="count">10 REELS</span></div><div class="reels" id="reels"></div></section>
<footer class="footer">SOUND WALK · LISTEN IN THE DARK</footer>
<audio id="audio" preload="metadata"></audio>
</main>
<script>
// 여기서 트랙의 제목과 설명을 변경하세요. audio 폴더의 파일 이름과 일치해야 합니다.
const tracks = [
 {title:'트랙 01',role:'인터뷰',src:'audio/01.mp3',map:'maps/01.png'},
 {title:'트랙 02',role:'인터뷰',src:'audio/02.mp3',map:'maps/02.png'},
 {title:'트랙 03',role:'인터뷰',src:'audio/03.mp3',map:'maps/03.png'},
 {title:'트랙 04',role:'인터뷰',src:'audio/04.mp3',map:'maps/04.png'},
 {title:'트랙 05',role:'인터뷰',src:'audio/05.mp3',map:'maps/05.png'},
 {title:'트랙 06',role:'인터뷰',src:'audio/06.mp3',map:'maps/06.png'},
 {title:'트랙 07',role:'인터뷰',src:'audio/07.mp3',map:'maps/07.png'},
 {title:'트랙 08',role:'인터뷰',src:'audio/08.mp3',map:'maps/08.png'},
 {title:'트랙 09',role:'인터뷰',src:'audio/09.mp3',map:'maps/09.png'},
 {title:'트랙 10',role:'인터뷰',src:'audio/10.mp3',map:'maps/10.png'}
];
const $=id=>document.getElementById(id);
const audio=$('audio'), reels=$('reels'), seek=$('seek'); let index=0;
function fmt(s){if(!Number.isFinite(s))return '00:00'; const m=Math.floor(s/60),r=Math.floor(s%60);return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`}
function syncPlay(){const isPlaying=!audio.paused;$('play-icon').innerHTML=isPlaying?'<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('play').setAttribute('aria-label',isPlaying?'일시정지':'재생')}
function render(){reels.innerHTML='';tracks.forEach((track,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='reel'+(i===index?' selected':'');btn.setAttribute('aria-label',`${i+1}번 ${track.title} 재생`);btn.setAttribute('aria-current',i===index?'true':'false');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const info=document.createElement('span');const name=document.createElement('div');name.className='name';name.textContent=track.title;const role=document.createElement('div');role.className='role';role.textContent=track.role;info.append(name,role);const mark=document.createElement('span');mark.className='mark';mark.textContent=i===index?'−':'+';btn.append(num,info,mark);btn.addEventListener('click',()=>load(i,true));reels.append(btn)})}

// 각 트랙에서 maps/01.png ... maps/10.png 경로를 읽습니다.
const mapImg=$('map-image'), mapLarge=$('map-large'), mapPlaceholder=$('map-placeholder'), mapDialog=$('map-dialog');
let mapAvailable=false;
function updateMap(){
 const num=String(index+1).padStart(2,'0');
 mapAvailable=false; mapPlaceholder.hidden=true; mapImg.hidden=false;
 $('map-id').textContent=`${num} / ${String(tracks.length).padStart(2,'0')}`;
 $('map-caption').textContent=`TRACK ${num} · WALK ROUTE`;
 $('dialog-title').textContent=`TRACK ${num} · WALK MAP`;
 mapImg.alt=`트랙 ${num}의 이동 경로 지도`;
 mapImg.src=tracks[index].map;
 mapLarge.src=tracks[index].map;
}
mapImg.addEventListener('load',()=>{mapAvailable=true;mapPlaceholder.hidden=true;mapImg.hidden=false});
mapImg.addEventListener('error',()=>{mapAvailable=false;mapImg.hidden=true;mapPlaceholder.hidden=false});
$('map-open').addEventListener('click',()=>{if(mapAvailable && typeof mapDialog.showModal==='function')mapDialog.showModal()});
$('map-close').addEventListener('click',()=>mapDialog.close());
mapDialog.addEventListener('click',e=>{if(e.target===mapDialog)mapDialog.close()});

function load(i,auto=false){index=(i+tracks.length)%tracks.length;audio.src=tracks[index].src;audio.load();$('playing-name').textContent=tracks[index].title;$('playing-role').textContent=tracks[index].role;$('counter').textContent=`${String(index+1).padStart(2,'0')} / ${String(tracks.length).padStart(2,'0')}`;seek.value=0;seek.style.setProperty('--progress','0%');$('current').textContent='00:00';$('duration').textContent='00:00';$('notice').textContent='';updateMap();render();syncPlay();if(auto)play()}
async function play(){try{if(audio.paused){await audio.play();$('notice').textContent=''}else audio.pause()}catch(e){$('notice').textContent='음원을 찾을 수 없습니다. audio 폴더에 MP3 파일을 업로드하세요.'}syncPlay()}
$('play').addEventListener('click',play);$('prev').addEventListener('click',()=>load(index-1,true));$('next').addEventListener('click',()=>load(index+1,true));audio.addEventListener('play',syncPlay);audio.addEventListener('pause',syncPlay);audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(audio.duration)});audio.addEventListener('timeupdate',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0){seek.value=Math.round(audio.currentTime/audio.duration*1000);seek.style.setProperty('--progress',`${audio.currentTime/audio.duration*100}%`)}$('current').textContent=fmt(audio.currentTime)});audio.addEventListener('ended',()=>load(index+1,true));audio.addEventListener('error',()=>{$('notice').textContent='이 트랙의 음원 파일이 없습니다. audio 폴더를 확인하세요.'});seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(seek.value)/1000*audio.duration;seek.style.setProperty('--progress',`${Number(seek.value)/10}%`)});load(0);
// 작은 비주기 운동을 합성해 두 개의 구슬이 서서히 궤도를 바꾸도록 합니다.
const stage=document.querySelector('.stage');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ob=[{orb:$('orb-blue'),glow:$('glow-blue'),phase:0},{orb:$('orb-orange'),glow:$('glow-orange'),phase:2.6}];
function move(t){const seconds=t/1000,w=stage.clientWidth,h=stage.clientHeight;ob.forEach((o,i)=>{const p=o.phase;const x=w*(i===0?.38:.64)+Math.sin(seconds*.15+p)*w*.15+Math.sin(seconds*.093+p*2.1)*w*.06;const y=h*(i===0?.39:.58)+Math.cos(seconds*.17+p)*h*.14+Math.sin(seconds*.113+p)*h*.065;const rot=seconds*(i===0?2.2:-1.8);const scale=1+.03*Math.sin(seconds*.22+p);o.orb.style.left=`${x}px`;o.orb.style.top=`${y}px`;o.orb.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`;o.glow.style.left=`${x}px`;o.glow.style.top=`${y}px`;});if(!reduced)requestAnimationFrame(move)}move(0);
</script>
